{% extends "base.html" %}
{% block title %}Sign up · CineVoice{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand">🎬 CineVoice</div>
    <h1>Create your account</h1>
    <p class="auth-sub">Join to rate and review movies.</p>
    <form method="POST" action="{{ url_for('signup') }}">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" value="{{ username }}" placeholder="3-20 chars, letters/numbers/_" required autofocus>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="At least 6 characters" required>

      <label for="confirm_password">Confirm password</label>
      <input type="password" id="confirm_password" name="confirm_password" required>

      <button type="submit" class="btn-primary btn-block">Sign up</button>
    </form>
    <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
  </div>
</div>
{% endblock %}
